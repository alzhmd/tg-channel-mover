[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "channel-mover"
dynamic = ["version"]
description = "Telegram bot that copies a whole channel into another one: no 'Forwarded from', albums and captions kept, Premium emoji preserved, resumable"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "alzhmd" }]
keywords = ["telegram", "telegram-bot", "channel", "migration", "backup", "telethon", "python-telegram-bot", "premium-emoji"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: No Input/Output (Daemon)",
    "Framework :: AsyncIO",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "python-telegram-bot>=22.7,<23",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "telethon>=1.45,<2",
    "qrcode[pil]>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
channel-mover = "chanmover.__main__:main"

[project.urls]
Homepage = "https://github.com/alzhmd/tg-channel-mover"
Issues = "https://github.com/alzhmd/tg-channel-mover/issues"
Changelog = "https://github.com/alzhmd/tg-channel-mover/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["chanmover"]

[tool.setuptools.package-data]
chanmover = ["data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "chanmover.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::telegram.warnings.PTBDeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "E501"]
"chanmover/handlers.py" = ["E501"]   # long Persian UI sentences
"chanmover/premium_ui.py" = ["E501"]
"chanmover/ui.py" = ["E501"]
